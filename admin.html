<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFI sa BUKID - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-gray-900 bg-opacity-90 z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Enter Password" class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="attemptLogin()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 transition">Login</button>
            <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden">Invalid Password</p>
        </div>
    </div>

    <!-- Main Dashboard (Hidden by default) -->
    <div id="dashboard" class="hidden">
        <!-- Navbar -->
        <nav class="bg-green-700 text-white p-4 shadow-md">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="ph ph-chart-bar text-2xl"></i>
                    <h1 class="text-xl font-bold">WIFI Admin Dashboard</h1>
                </div>
                <div class="flex items-center gap-4">
                    <select id="monthFilter" onchange="renderDashboard()" class="text-gray-800 p-2 rounded-lg text-sm border-none focus:ring-2 focus:ring-green-400">
                        <option value="all">All Time</option>
                        <!-- Options populated via JS -->
                    </select>
                    <button onclick="location.reload()" class="hover:bg-green-600 p-2 rounded-lg"><i class="ph ph-arrow-clockwise"></i></button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto p-6 space-y-6">

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm">Total Sales</p>
                    <h2 class="text-2xl font-bold text-gray-800" id="totalSales">₱0.00</h2>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm">Transactions</p>
                    <h2 class="text-2xl font-bold text-gray-800" id="totalTxns">0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-purple-500">
                    <p class="text-gray-500 text-sm">Unique Users</p>
                    <h2 class="text-2xl font-bold text-gray-800" id="uniqueUsers">0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-orange-500">
                    <p class="text-gray-500 text-sm">Avg. Transaction</p>
                    <h2 class="text-2xl font-bold text-gray-800" id="avgTxn">₱0.00</h2>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Payment Method Chart -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="font-bold text-gray-700 mb-4">Sales by Payment Method</h3>
                    <div class="relative h-64">
                        <canvas id="paymentChart"></canvas>
                    </div>
                </div>
                <!-- Plan Chart -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="font-bold text-gray-700 mb-4">Sales by Plan</h3>
                    <div class="relative h-64">
                        <canvas id="planChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Tables Section -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Top Users Table -->
                <div class="bg-white p-6 rounded-xl shadow-sm overflow-hidden">
                    <h3 class="font-bold text-gray-700 mb-4">Top Users (by Spend)</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 text-gray-600 border-b">
                                <tr>
                                    <th class="p-3">Mobile Number</th>
                                    <th class="p-3">Txns</th>
                                    <th class="p-3 text-right">Total Spent</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div class="bg-white p-6 rounded-xl shadow-sm overflow-hidden">
                    <h3 class="font-bold text-gray-700 mb-4">Recent Transactions</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 text-gray-600 border-b">
                                <tr>
                                    <th class="p-3">Date</th>
                                    <th class="p-3">Plan</th>
                                    <th class="p-3">Method</th>
                                    <th class="p-3 text-right">Amount</th>
                                    <th class="p-3 text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody id="txnsTableBody" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let rawData = [];
        let paymentChartInstance = null;
        let planChartInstance = null;

        function attemptLogin() {
            const pass = document.getElementById('adminPass').value;
            const btn = document.querySelector('#loginModal button');
            const err = document.getElementById('loginError');

            btn.innerText = "Verifying...";
            btn.disabled = true;
            err.classList.add('hidden');

            google.script.run
                .withSuccessHandler(function(data) {
                    if (data && !data.error) {
                        rawData = data;
                        document.getElementById('loginModal').classList.add('hidden');
                        document.getElementById('dashboard').classList.remove('hidden');
                        initDashboard();
                    } else {
                        btn.innerText = "Login";
                        btn.disabled = false;
                        err.classList.remove('hidden');
                        err.innerText = data ? data.error : "Unknown Error";
                    }
                })
                .withFailureHandler(function(e) {
                    btn.innerText = "Login";
                    btn.disabled = false;
                    err.classList.remove('hidden');
                    err.innerText = "Connection Failed: " + e.message;
                })
                .getAdminData(pass);
        }

        function initDashboard() {
            populateMonthFilter();
            renderDashboard();
        }

        function populateMonthFilter() {
            const select = document.getElementById('monthFilter');
            const months = new Set();

            rawData.forEach(row => {
                const date = new Date(row.timestamp);
                const key = date.toLocaleString('default', { month: 'long', year: 'numeric' });
                months.add(key);
            });

            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                select.appendChild(opt);
            });
        }

        function renderDashboard() {
            const filterValue = document.getElementById('monthFilter').value;

            // Filter Data
            const filteredData = rawData.filter(row => {
                if (filterValue === 'all') return true;
                const date = new Date(row.timestamp);
                const key = date.toLocaleString('default', { month: 'long', year: 'numeric' });
                return key === filterValue;
            });

            // --- Metrics ---
            // Only count successful payments for sales metrics
            const salesData = filteredData.filter(r =>
                r.status === 'PAID_PENDING_SYNC' || r.status === 'SYNCED'
            );

            const totalSales = salesData.reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
            const totalTxns = filteredData.length; // Show all attempts in txn count? Or just sales? Usually Sales. Let's show Sales count.
            const uniqueUsers = new Set(salesData.map(r => r.mobile)).size;
            const avgTxn = salesData.length ? (totalSales / salesData.length) : 0;

            document.getElementById('totalSales').innerText = '₱' + totalSales.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('totalTxns').innerText = salesData.length; // Successful
            document.getElementById('uniqueUsers').innerText = uniqueUsers;
            document.getElementById('avgTxn').innerText = '₱' + avgTxn.toFixed(2);

            // --- Aggregations ---

            // By Payment Method
            const methodStats = {};
            salesData.forEach(r => {
                const m = r.method || 'Unknown';
                methodStats[m] = (methodStats[m] || 0) + parseFloat(r.amount);
            });

            // By Plan
            const planStats = {};
            salesData.forEach(r => {
                // Extract "1 Hour", "1 Day" etc from description or amount
                // Description format: "1 Hour WiFi Access"
                let p = r.description.replace(' WiFi Access', '');
                planStats[p] = (planStats[p] || 0) + parseFloat(r.amount);
            });

            // By Mobile (User Report)
            const userStats = {};
            salesData.forEach(r => {
                const u = r.mobile;
                if (!userStats[u]) userStats[u] = { count: 0, total: 0 };
                userStats[u].count++;
                userStats[u].total += parseFloat(r.amount);
            });
            const sortedUsers = Object.entries(userStats)
                .map(([mobile, data]) => ({ mobile, ...data }))
                .sort((a, b) => b.total - a.total);

            // --- Render Charts ---
            renderChart('paymentChart', 'Payment Method', Object.keys(methodStats), Object.values(methodStats), paymentChartInstance, (chart) => paymentChartInstance = chart);
            renderChart('planChart', 'Plan', Object.keys(planStats), Object.values(planStats), planChartInstance, (chart) => planChartInstance = chart);

            // --- Render Tables ---

            // Top Users
            const userTbody = document.getElementById('usersTableBody');
            userTbody.innerHTML = '';
            sortedUsers.slice(0, 10).forEach(u => {
                userTbody.innerHTML += `
                    <tr>
                        <td class="p-3 text-gray-700">${u.mobile}</td>
                        <td class="p-3 text-gray-600">${u.count}</td>
                        <td class="p-3 text-right font-bold text-green-600">₱${u.total.toFixed(2)}</td>
                    </tr>
                `;
            });

            // Recent Transactions (Show ALL statuses here for visibility)
            const txnTbody = document.getElementById('txnsTableBody');
            txnTbody.innerHTML = '';
            // Sort by date desc
            const sortedTxns = [...filteredData].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            sortedTxns.slice(0, 20).forEach(t => {
                let statusColor = 'text-gray-500';
                if (t.status.includes('PAID') || t.status === 'SYNCED') statusColor = 'text-green-600 font-bold';
                if (t.status === 'CANCELLED') statusColor = 'text-red-500';
                if (t.status === 'INITIALIZING') statusColor = 'text-yellow-500';

                const dateStr = new Date(t.timestamp).toLocaleDateString() + ' ' + new Date(t.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                txnTbody.innerHTML += `
                    <tr>
                        <td class="p-3 text-gray-600 text-xs">${dateStr}</td>
                        <td class="p-3 text-gray-800">${t.description.replace(' WiFi Access', '')}</td>
                        <td class="p-3 text-gray-600 text-xs uppercase">${t.method || '-'}</td>
                        <td class="p-3 text-right font-medium">₱${t.amount}</td>
                        <td class="p-3 text-center text-xs ${statusColor}">${t.status}</td>
                    </tr>
                `;
            });
        }

        function renderChart(canvasId, label, labels, data, instance, setInstance) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (instance) instance.destroy();

            const config = {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Sales (₱)',
                        data: data,
                        backgroundColor: [
                            '#16a34a', '#2563eb', '#ca8a04', '#9333ea', '#db2777'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            };

            setInstance(new Chart(ctx, config));
        }

    </script>
</body>
</html>
