<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFI sa BUKID - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .hidden { display: none; }
        /* Custom scrollbar for tables */
        .scroller::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .scroller::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .scroller::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .scroller::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden flex flex-col">

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-gray-900 bg-opacity-90 z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Enter Password" class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="attemptLogin()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 transition">Login</button>
            <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden">Invalid Password</p>
        </div>
    </div>

    <!-- Navbar (Fixed) -->
    <nav class="bg-green-700 text-white p-4 shadow-md flex-none z-10">
        <div class="container mx-auto flex justify-between items-center px-4">
            <div class="flex items-center gap-2">
                <i class="ph ph-chart-bar text-2xl"></i>
                <h1 class="text-xl font-bold">WIFI Admin Dashboard</h1>
            </div>
            <div class="flex items-center gap-4">
                <select id="monthFilter" onchange="renderDashboard()" class="text-gray-800 p-2 rounded-lg text-sm border-none focus:ring-2 focus:ring-green-400 cursor-pointer">
                    <option value="all">All Time</option>
                    <!-- Options populated via JS -->
                </select>
                <button onclick="location.reload()" class="hover:bg-green-600 p-2 rounded-lg transition" title="Refresh"><i class="ph ph-arrow-clockwise text-lg"></i></button>
            </div>
        </div>
    </nav>

    <!-- Main Dashboard Container (Flex Column, No Scroll on Body) -->
    <div id="dashboard" class="flex-1 flex flex-col overflow-hidden hidden p-4 gap-4 max-w-7xl mx-auto w-full">

        <!-- Top Section: Stats & Charts (Flex-none or limited growth) -->
        <div class="flex flex-col lg:flex-row gap-4 h-1/2 min-h-[300px]">

            <!-- Left: Stats Grid -->
            <div class="grid grid-cols-2 gap-4 lg:w-1/3 h-full">
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500 flex flex-col justify-center">
                    <p class="text-gray-500 text-xs uppercase font-semibold">Total Sales</p>
                    <h2 class="text-2xl font-bold text-gray-800" id="totalSales">₱0.00</h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 flex flex-col justify-center">
                    <p class="text-gray-500 text-xs uppercase font-semibold">Transactions</p>
                    <h2 class="text-2xl font-bold text-gray-800" id="totalTxns">0</h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-purple-500 flex flex-col justify-center">
                    <p class="text-gray-500 text-xs uppercase font-semibold">Unique Users</p>
                    <h2 class="text-2xl font-bold text-gray-800" id="uniqueUsers">0</h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-orange-500 flex flex-col justify-center">
                    <p class="text-gray-500 text-xs uppercase font-semibold">Avg. Spend</p>
                    <h2 class="text-2xl font-bold text-gray-800" id="avgTxn">₱0.00</h2>
                </div>
            </div>

            <!-- Right: Charts -->
            <div class="flex flex-col sm:flex-row gap-4 lg:w-2/3 h-full">
                <!-- Payment Method Chart -->
                <div class="bg-white p-4 rounded-xl shadow-sm flex-1 flex flex-col min-w-0">
                    <h3 class="font-bold text-gray-700 mb-2 text-sm">Sales by Method</h3>
                    <div class="flex-1 relative min-h-0">
                        <canvas id="paymentChart"></canvas>
                    </div>
                </div>
                <!-- Plan Chart -->
                <div class="bg-white p-4 rounded-xl shadow-sm flex-1 flex flex-col min-w-0">
                    <h3 class="font-bold text-gray-700 mb-2 text-sm">Sales by Plan</h3>
                    <div class="flex-1 relative min-h-0">
                        <canvas id="planChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: Tables (Flex-1 to take remaining space, Scrollable) -->
        <div class="flex flex-col lg:flex-row gap-4 flex-1 min-h-0">

            <!-- Top Users Table -->
            <div class="bg-white rounded-xl shadow-sm flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b bg-gray-50">
                    <h3 class="font-bold text-gray-700 text-sm">Top Users (by Spend)</h3>
                </div>
                <div class="overflow-y-auto flex-1 p-0 scroller">
                    <table class="w-full text-left text-sm relative">
                        <thead class="bg-gray-100 text-gray-600 sticky top-0 z-10">
                            <tr>
                                <th class="p-3 font-semibold">Mobile Number</th>
                                <th class="p-3 font-semibold text-center">Txns</th>
                                <th class="p-3 font-semibold text-right">Total Spent</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="divide-y text-gray-700">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                    <div id="noUsersMsg" class="hidden p-8 text-center text-gray-400 text-sm">No data available</div>
                </div>
            </div>

            <!-- Recent Transactions Table -->
            <div class="bg-white rounded-xl shadow-sm flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b bg-gray-50">
                    <h3 class="font-bold text-gray-700 text-sm">Transaction Log</h3>
                </div>
                <div class="overflow-y-auto flex-1 p-0 scroller">
                    <table class="w-full text-left text-sm relative">
                        <thead class="bg-gray-100 text-gray-600 sticky top-0 z-10">
                            <tr>
                                <th class="p-3 font-semibold">Date</th>
                                <th class="p-3 font-semibold">Plan</th>
                                <th class="p-3 font-semibold">Method</th>
                                <th class="p-3 font-semibold text-right">Amt</th>
                                <th class="p-3 font-semibold text-center">Status</th>
                            </tr>
                        </thead>
                        <tbody id="txnsTableBody" class="divide-y text-gray-700">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                    <div id="noTxnsMsg" class="hidden p-8 text-center text-gray-400 text-sm">No transactions found</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let rawData = [];
        let paymentChartInstance = null;
        let planChartInstance = null;

        function attemptLogin() {
            const pass = document.getElementById('adminPass').value;
            const btn = document.querySelector('#loginModal button');
            const err = document.getElementById('loginError');

            btn.innerText = "Verifying...";
            btn.disabled = true;
            err.classList.add('hidden');

            google.script.run
                .withSuccessHandler(function(data) {
                    if (data && !data.error) {
                        console.log("Data received:", data.length, "rows");
                        rawData = data;
                        document.getElementById('loginModal').classList.add('hidden');
                        document.getElementById('dashboard').classList.remove('hidden');
                        initDashboard();
                    } else {
                        console.error("Login failed:", data);
                        btn.innerText = "Login";
                        btn.disabled = false;
                        err.classList.remove('hidden');
                        err.innerText = data ? data.error : "Unknown Error";
                    }
                })
                .withFailureHandler(function(e) {
                    console.error("Connection failed:", e);
                    btn.innerText = "Login";
                    btn.disabled = false;
                    err.classList.remove('hidden');
                    err.innerText = "Connection Failed: " + e.message;
                })
                .getAdminData(pass);
        }

        function initDashboard() {
            populateMonthFilter();
            renderDashboard();
        }

        function populateMonthFilter() {
            const select = document.getElementById('monthFilter');
            const months = new Set();

            rawData.forEach(row => {
                if (!row.timestamp) return;
                const date = new Date(row.timestamp);
                if (isNaN(date)) return;
                const key = date.toLocaleString('default', { month: 'long', year: 'numeric' });
                months.add(key);
            });

            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                select.appendChild(opt);
            });
        }

        function renderDashboard() {
            const filterValue = document.getElementById('monthFilter').value;

            // Filter Data
            const filteredData = rawData.filter(row => {
                if (!row.timestamp) return false;
                if (filterValue === 'all') return true;
                const date = new Date(row.timestamp);
                if (isNaN(date)) return false;
                const key = date.toLocaleString('default', { month: 'long', year: 'numeric' });
                return key === filterValue;
            });

            // --- Metrics & Charts Base ---
            // "Sales" = Successful transactions only
            const salesData = filteredData.filter(r =>
                (r.status && (r.status.includes('PAID') || r.status === 'SYNCED'))
            );

            const totalSales = salesData.reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
            const totalTxns = salesData.length;
            const uniqueUsers = new Set(salesData.map(r => r.mobile)).size;
            const avgTxn = salesData.length ? (totalSales / salesData.length) : 0;

            document.getElementById('totalSales').innerText = '₱' + totalSales.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('totalTxns').innerText = totalTxns;
            document.getElementById('uniqueUsers').innerText = uniqueUsers;
            document.getElementById('avgTxn').innerText = '₱' + avgTxn.toFixed(2);

            // --- Charts Data Preparation ---

            // By Payment Method
            const methodStats = {};
            salesData.forEach(r => {
                const m = r.method ? r.method.toUpperCase() : 'UNKNOWN';
                methodStats[m] = (methodStats[m] || 0) + parseFloat(r.amount || 0);
            });

            // By Plan
            const planStats = {};
            salesData.forEach(r => {
                const desc = r.description || 'Unknown Plan';
                let p = desc.replace(' WiFi Access', '').replace(' Pass', '');
                planStats[p] = (planStats[p] || 0) + parseFloat(r.amount || 0);
            });

            // --- Render Charts ---
            renderChart('paymentChart', Object.keys(methodStats), Object.values(methodStats), paymentChartInstance, (chart) => paymentChartInstance = chart);
            renderChart('planChart', Object.keys(planStats), Object.values(planStats), planChartInstance, (chart) => planChartInstance = chart);

            // --- Tables Data Preparation ---

            // Top Users (By Spend)
            const userStats = {};
            salesData.forEach(r => {
                const u = r.mobile || 'Unknown';
                if (!userStats[u]) userStats[u] = { count: 0, total: 0 };
                userStats[u].count++;
                userStats[u].total += parseFloat(r.amount || 0);
            });
            const sortedUsers = Object.entries(userStats)
                .map(([mobile, data]) => ({ mobile, ...data }))
                .sort((a, b) => b.total - a.total);

            // Render Top Users
            const userTbody = document.getElementById('usersTableBody');
            userTbody.innerHTML = '';
            if (sortedUsers.length === 0) {
                document.getElementById('noUsersMsg').classList.remove('hidden');
            } else {
                document.getElementById('noUsersMsg').classList.add('hidden');
                sortedUsers.forEach(u => {
                    userTbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-3 font-medium text-gray-800">${u.mobile}</td>
                            <td class="p-3 text-center text-gray-500">${u.count}</td>
                            <td class="p-3 text-right font-bold text-green-600">₱${u.total.toFixed(2)}</td>
                        </tr>
                    `;
                });
            }

            // Recent Transactions (Show ALL filtered data, not just sales, so we see Pending/Cancelled too)
            const txnTbody = document.getElementById('txnsTableBody');
            txnTbody.innerHTML = '';

            // Sort by date desc
            const sortedTxns = [...filteredData].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            if (sortedTxns.length === 0) {
                document.getElementById('noTxnsMsg').classList.remove('hidden');
            } else {
                document.getElementById('noTxnsMsg').classList.add('hidden');
                sortedTxns.forEach(t => {
                    let statusColor = 'text-gray-500 bg-gray-100';
                    let statusText = t.status || 'UNKNOWN';

                    if (statusText.includes('PAID') || statusText === 'SYNCED') {
                        statusColor = 'text-green-700 bg-green-100';
                        statusText = 'PAID';
                    } else if (statusText === 'CANCELLED') {
                        statusColor = 'text-red-700 bg-red-100';
                    } else if (statusText === 'INITIALIZING' || statusText === 'PENDING_PAYMENT') {
                        statusColor = 'text-yellow-700 bg-yellow-100';
                        statusText = 'PENDING';
                    }

                    const dateObj = new Date(t.timestamp);
                    const dateStr = dateObj.toLocaleDateString();
                    const timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const planName = (t.description || '-').replace(' WiFi Access', '').replace(' Pass', '');

                    txnTbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition border-b last:border-none">
                            <td class="p-3">
                                <div class="font-medium text-gray-800">${dateStr}</div>
                                <div class="text-xs text-gray-500">${timeStr}</div>
                            </td>
                            <td class="p-3 text-sm text-gray-700">${planName}</td>
                            <td class="p-3 text-xs uppercase font-semibold text-gray-500">${t.method || '-'}</td>
                            <td class="p-3 text-right font-medium text-gray-800">₱${t.amount || '0'}</td>
                            <td class="p-3 text-center">
                                <span class="px-2 py-1 rounded-full text-[10px] font-bold ${statusColor}">${statusText}</span>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        function renderChart(canvasId, labels, data, instance, setInstance) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (instance) instance.destroy();

            // Handle empty data
            if (data.length === 0) {
                // Render a placeholder or empty chart?
                // Chart.js handles empty arrays gracefully usually, but let's check
                labels = ['No Data'];
                data = [1]; // Placeholder grey ring
                var bgColors = ['#e2e8f0'];
            } else {
                var bgColors = ['#16a34a', '#2563eb', '#ca8a04', '#9333ea', '#db2777', '#0891b2'];
            }

            const config = {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: bgColors,
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { boxWidth: 12, font: { size: 11 } }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    if (label === 'No Data') return ' No Sales yet';
                                    let value = context.raw || 0;
                                    return ` ₱${value.toLocaleString()}`;
                                }
                            }
                        }
                    }
                }
            };

            setInstance(new Chart(ctx, config));
        }

    </script>
</body>
</html>
