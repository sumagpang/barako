<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; margin: 2em; }
      h1, h2 { color: #333; }
      #main-nav, #recipe-details-view { display: none; }
      .form-group { margin-bottom: 1em; }
      label { display: block; margin-bottom: 0.5em; }
      input, select { width: 100%; padding: 0.5em; margin-bottom: 1em; border: 1px solid #ccc; border-radius: 4px; }
      button { background-color: #007bff; color: white; padding: 0.75em 1.5em; border: none; border-radius: 4px; cursor: pointer; }
      button:hover { background-color: #0056b3; }
      .ingredient-group { margin-bottom: 1em; padding: 1em; border: 1px solid #eee; border-radius: 4px; }
      #recipes-list ul { list-style-type: none; padding: 0; }
      #recipes-list li { margin-bottom: 0.5em; }
      #recipes-list a { cursor: pointer; color: #007bff; text-decoration: underline; }
      .error-message { color: red; font-style: italic; }
      table { width: 100%; border-collapse: collapse; margin-top: 1em; }
      th, td { padding: 0.75em; text-align: left; border-bottom: 1px solid #ddd; }
      thead { background-color: #f2f2f2; }
    </style>
  </head>
  <body>
    <h1>Recipe Book</h1>

    <div id="main-nav">
      <button onclick="showView('add-ingredient-view')">Add Ingredient</button>
      <button onclick="showView('add-recipe-view')">Add Recipe</button>
      <button onclick="showView('recipes-list-view')">View Recipes</button>
      <button onclick="showView('view-ingredients-view')">View Ingredients</button>
    </div>

    <!-- Add Ingredient View -->
    <div id="add-ingredient-view" class="view">
      <h2>Add Ingredient Purchase</h2>
      <div class="form-group">
        <label for="ingredient-name">Name:</label>
        <input type="text" id="ingredient-name">
      </div>
      <div class="form-group">
        <label for="ingredient-cost">Total Cost:</label>
        <input type="number" id="ingredient-cost" step="0.01">
      </div>
       <div class="form-group">
        <label for="ingredient-quantity">Quantity:</label>
        <input type="number" id="ingredient-quantity" step="0.01">
      </div>
      <div class="form-group">
        <label for="ingredient-uom">Unit of Measure (e.g., kg, L, item):</label>
        <input type="text" id="ingredient-uom">
      </div>
      <div class="form-group">
        <label for="purchase-date">Purchase Date:</label>
        <input type="date" id="purchase-date">
      </div>
      <div class="form-group">
        <label for="store">Store:</label>
        <input type="text" id="store">
      </div>
      <button onclick="addIngredient()">Submit</button>
    </div>

    <!-- Add Recipe View -->
    <div id="add-recipe-view" class="view" style="display:none;">
      <h2>Add Recipe</h2>
      <div class="form-group">
        <label for="recipe-name">Recipe Name:</label>
        <input type="text" id="recipe-name">
      </div>
      <div id="ingredients-container">
        <!-- Dynamic ingredients will be added here -->
      </div>
      <button type="button" onclick="addIngredientField()">Add Ingredient</button>
      <button onclick="addRecipe()">Create Recipe</button>
    </div>

    <!-- Recipes List View -->
    <div id="recipes-list-view" class="view" style="display:none;">
      <h2>All Recipes</h2>
      <input type="text" id="recipe-search" onkeyup="filterRecipes()" placeholder="Search for recipes..">
      <div id="recipes-list"></div>
    </div>

    <!-- Recipe Details View -->
    <div id="recipe-details-view" class="view" style="display:none;">
      <h2 id="details-recipe-name"></h2>
      <p><strong>Total Cost:</strong> <span id="details-total-cost"></span></p>
      <h3>Ingredients:</h3>
      <ul id="details-ingredients-list"></ul>
      <button onclick="showView('recipes-list-view')">Back to Recipes</button>
    </div>

    <!-- View Ingredients View -->
    <div id="view-ingredients-view" class="view" style="display:none;">
      <h2>All Ingredient Purchases</h2>
      <input type="text" id="ingredient-search" onkeyup="filterIngredients()" placeholder="Search for ingredients..">
      <table id="ingredients-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      var availableIngredients = [];

      function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
        document.getElementById(viewId).style.display = 'block';
        if (viewId === 'recipes-list-view') loadRecipes();
        if (viewId === 'add-recipe-view') loadIngredientsForRecipeForm();
        if (viewId === 'view-ingredients-view') loadAllIngredients();
      }

      function addIngredient() {
        var name = document.getElementById('ingredient-name').value;
        var cost = document.getElementById('ingredient-cost').value;
        var quantity = document.getElementById('ingredient-quantity').value;
        var uom = document.getElementById('ingredient-uom').value;
        var date = document.getElementById('purchase-date').value;
        var store = document.getElementById('store').value;

        if (!name || !cost || !quantity || !uom || !date) {
          alert('Please fill in all required fields.');
          return;
        }

        google.script.run.withSuccessHandler((updatedIngredients) => {
          availableIngredients = updatedIngredients; // Update the global list
          alert('Ingredient added!');
          document.getElementById('ingredient-name').value = '';
          document.getElementById('ingredient-cost').value = '';
          document.getElementById('ingredient-quantity').value = '';
          document.getElementById('ingredient-uom').value = '';
          document.getElementById('purchase-date').value = '';
          document.getElementById('store').value = '';
          showView('view-ingredients-view'); // Go to the ingredients view
        }).addIngredient(name, parseFloat(cost), date, store, parseFloat(quantity), uom);
      }

      function loadIngredientsForRecipeForm() {
        google.script.run
          .withFailureHandler(err => alert('Error loading ingredients: ' + err.message))
          .withSuccessHandler(uniqueNames => {
            availableIngredients = uniqueNames;
            document.getElementById('ingredients-container').innerHTML = ''; // Clear existing
            addIngredientField(); // Add the first ingredient field
          }).getUniqueIngredientNames();
      }

      function addIngredientField() {
        var container = document.getElementById('ingredients-container');
        var div = document.createElement('div');
        div.className = 'ingredient-group';
        var select = '<select class="ingredient-name">';
        availableIngredients.forEach(ing => {
          select += `<option value="${ing}">${ing}</option>`;
        });
        select += '</select>';
        div.innerHTML = `
          ${select}
          <input type="number" class="ingredient-quantity" placeholder="Quantity" step="0.01">
          <input type="text" class="ingredient-uom" placeholder="UoM">
        `;
        container.appendChild(div);
      }

      function addRecipe() {
        var recipeName = document.getElementById('recipe-name').value;
        if (!recipeName) {
          alert('Please enter a recipe name.');
          return;
        }

        var ingredients = [];
        var ingredientGroups = document.querySelectorAll('.ingredient-group');
        if (ingredientGroups.length === 0) {
          alert('Please add at least one ingredient.');
          return;
        }

        for (var i = 0; i < ingredientGroups.length; i++) {
          var group = ingredientGroups[i];
          var name = group.querySelector('.ingredient-name').value;
          var quantity = group.querySelector('.ingredient-quantity').value;
          var uom = group.querySelector('.ingredient-uom').value;
          if (!name || !quantity || isNaN(parseFloat(quantity)) || !uom) {
            alert('Please ensure all ingredients have a name, a valid quantity, and a UoM.');
            return;
          }
          ingredients.push({ name: name, quantity: parseFloat(quantity), uom: uom });
        }

        google.script.run
          .withFailureHandler(err => alert('Error adding recipe: ' + err.message))
          .withSuccessHandler(() => {
            alert('Recipe added!');
            document.getElementById('recipe-name').value = '';
            document.getElementById('ingredients-container').innerHTML = '';
            showView('recipes-list-view');
          }).addRecipe(recipeName, ingredients);
      }

      function loadRecipes() {
        google.script.run
          .withFailureHandler(err => alert('Error loading recipes: ' + err.message))
          .withSuccessHandler(recipes => {
            var list = document.getElementById('recipes-list');
            list.innerHTML = '<ul></ul>';
            var ul = list.firstChild;
            recipes.slice(1).forEach(recipe => { // Skip header
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.textContent = recipe[0];
              a.onclick = function() { getRecipeDetails(recipe[0]); };
              li.appendChild(a);
              ul.appendChild(li);
            });
          }).getRecipes();
      }

      function getRecipeDetails(recipeName) {
        google.script.run
          .withFailureHandler(err => alert('Error getting recipe details: ' + err.message))
          .withSuccessHandler(details => {
            document.getElementById('details-recipe-name').textContent = details.recipeName;
            document.getElementById('details-total-cost').textContent = '$' + details.totalCost.toFixed(2);
            var list = document.getElementById('details-ingredients-list');
            list.innerHTML = '';
            details.ingredients.forEach(ing => {
              var li = document.createElement('li');
              var content = `${ing.quantity} ${ing.uom} ${ing.name} - `;
              if (ing.status === 'OK') {
                content += `Total: $${ing.cost.toFixed(2)} (@ $${ing.baseUnitPrice.toFixed(4)}/${ing.baseUnit})`;
              } else {
                content += `<span class="error-message">${ing.status}</span>`;
              }
              li.innerHTML = content;
              list.appendChild(li);
            });
            showView('recipe-details-view');
          }).getRecipeDetails(recipeName);
      }

      function loadAllIngredients() {
        google.script.run
          .withFailureHandler(err => alert('Error loading ingredient purchases: ' + err.message))
          .withSuccessHandler(data => {
            var table = document.getElementById('ingredients-table');
            var thead = table.querySelector('thead');
            var tbody = table.querySelector('tbody');

            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (data.length > 0) {
              var headerRow = document.createElement('tr');
              data[0].forEach(headerText => {
                var th = document.createElement('th');
                th.textContent = headerText;
                headerRow.appendChild(th);
              });
              thead.appendChild(headerRow);

              for (var i = 1; i < data.length; i++) {
                var row = document.createElement('tr');
                data[i].forEach(cellText => {
                  var td = document.createElement('td');
                  td.textContent = cellText;
                  row.appendChild(td);
                });
                tbody.appendChild(row);
              }
            }
          }).getAllIngredientPurchases();
      }

      function filterIngredients() {
        var input, filter, table, tr, td, i, txtValue;
        input = document.getElementById("ingredient-search");
        filter = input.value.toUpperCase();
        table = document.getElementById("ingredients-table");
        tr = table.getElementsByTagName("tr");

        for (i = 1; i < tr.length; i++) { // Start from 1 to skip header
          var display = "none";
          td = tr[i].getElementsByTagName("td");
          for (var j = 0; j < td.length; j++) {
            if (td[j]) {
              txtValue = td[j].textContent || td[j].innerText;
              if (txtValue.toUpperCase().indexOf(filter) > -1) {
                display = "";
                break;
              }
            }
          }
          tr[i].style.display = display;
        }
      }

      function filterRecipes() {
        var input, filter, ul, li, a, i, txtValue;
        input = document.getElementById("recipe-search");
        filter = input.value.toUpperCase();
        ul = document.getElementById("recipes-list").getElementsByTagName("ul")[0];
        li = ul.getElementsByTagName("li");

        for (i = 0; i < li.length; i++) {
          a = li[i].getElementsByTagName("a")[0];
          txtValue = a.textContent || a.innerText;
          if (txtValue.toUpperCase().indexOf(filter) > -1) {
            li[i].style.display = "";
          } else {
            li[i].style.display = "none";
          }
        }
      }

      // Initial Load
      document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('main-nav').style.display = 'block';
        showView('recipes-list-view');
      });
    </script>
  </body>
</html>
