<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIFI sa BUKID</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-green: #1b8e3d; /* Adjust based on image */
      --light-green: #e6f4ea;
      --border-color: #e0e0e0;
      --text-dark: #333;
      --text-light: #666;
      --accent-orange: #ff6d00;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #333; /* Dark background like the overlay in image */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80'); /* Fallback nature bg */
      background-size: cover;
      background-position: center;
    }

    /* Overlay for the background */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5); /* Darkening overlay */
      z-index: -1;
    }

    .main-card {
      background: #f9f9f9;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      position: relative;
    }

    .header {
      background-color: var(--primary-green);
      color: white;
      text-align: center;
      padding: 30px 20px;
      border-bottom-left-radius: 20px; /* Slight curve maybe? Image looks flat but rounded top */
      border-bottom-right-radius: 20px;
    }

    .header-icon {
      background: rgba(255, 255, 255, 0.2);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
    }

    .header-icon svg {
      fill: white;
      width: 24px;
      height: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }

    .step-num {
      background: #d1e7dd;
      color: var(--primary-green);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      margin-right: 8px;
    }

    /* Promo Grid */
    .promo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .promo-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .promo-card:hover {
      border-color: var(--primary-green);
    }

    .promo-card.selected {
      border-color: var(--primary-green);
      background-color: var(--light-green);
      box-shadow: 0 0 0 1px var(--primary-green);
    }

    .badge-best {
      position: absolute;
      top: -8px;
      right: -5px;
      background: var(--accent-orange);
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .plan-time {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-dark);
      display: block;
    }

    .plan-desc {
      font-size: 10px;
      color: var(--text-light);
      margin-top: 2px;
      display: block;
    }

    .plan-price {
      position: absolute;
      top: 15px;
      right: 15px;
      font-weight: 700;
      font-size: 14px;
      color: var(--primary-green);
    }

    /* Payment Methods */
    .payment-methods {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
      justify-content: center; /* Centered */
      align-items: center;
    }

    .pm-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 8px;
      border: 2px solid transparent;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .pm-item:hover {
      background-color: #f0f0f0;
    }

    .pm-item.selected {
      border-color: var(--primary-green);
      background-color: var(--light-green);
      transform: scale(1.05);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .pm-logo {
      height: 35px; /* Fixed height for consistency */
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
    }

    /* Mobile Input */
    .mobile-input-container {
      margin-bottom: 30px;
    }

    .mobile-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hint-text {
      font-size: 10px;
      color: #999;
    }

    .input-wrapper {
      position: relative;
      margin-top: 5px;
    }

    .prefix {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 700;
      font-size: 14px;
      color: var(--text-dark);
    }

    input[type="tel"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 12px 12px 50px; /* Space for prefix */
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      outline: none;
      background: white;
    }

    input[type="tel"]:focus {
      border-color: var(--primary-green);
    }

    /* Footer / Action */
    .action-area {
      background: #f9f9f9; /* Or transparent */
      padding-top: 10px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .total-label {
      color: var(--text-light);
      font-size: 14px;
    }

    .total-amount {
      color: var(--primary-green);
      font-size: 20px;
      font-weight: 700;
    }

    .btn-proceed {
      width: 100%;
      background-color: #cfd8dc; /* Disabled look initially */
      color: #546e7a;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: not-allowed;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s, color 0.3s;
    }

    .btn-proceed.active {
      background-color: #b0bec5; /* Slightly darker grey as per image, or primary green? Image shows grey but implies action. */
      /* Actually image shows "Select Payment Method ->" on a grey button.
         Usually this becomes colored when valid. I'll make it Green when valid. */
      background-color: var(--primary-green);
      color: white;
      cursor: pointer;
    }

    .btn-proceed:hover.active {
      background-color: #146c2e;
    }

    .footer-text {
      text-align: center;
      font-size: 9px;
      color: #aaa;
      margin-top: 15px;
      line-height: 1.4;
    }

    .footer-text a {
      color: #aaa;
      text-decoration: underline;
    }

    /* Loader */
    .loader {
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Error Message */
    #error-msg {
      color: #d32f2f;
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

  </style>
</head>

          Select Plan &amp; Method &rarr; <div class="loader" id="loader"></div>
        </button>

        <div id="error-msg"></div>

        <div class="footer-text">
          Powered by PayMongo & Semaphore.<br>
          <a href="#">Terms of Service</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    let selectedPlanId = null;
    let selectedPaymentMethod = null;

    function selectPlan(id, price, element) {
      // Update selected state visually
      document.querySelectorAll('.promo-card').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      // Set state
      selectedPlanId = id;
      document.getElementById('total-display').innerText = '₱' + price + '.00';

      checkForm();
    }

    function selectPaymentMethod(method, element) {
      // Update selected state visually
      document.querySelectorAll('.pm-item').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      // Set state
      selectedPaymentMethod = method;
      checkForm();
    }

    function validateInput(input) {
      // Remove non-numeric
      input.value = input.value.replace(/[^0-9]/g, '');
      checkForm();
    }

    function checkForm() {
      const mobile = document.getElementById('mobile').value;
      const btn = document.getElementById('btn-proceed');

      // Simple validation: Plan selected + Payment Method + 10 digits
      if (selectedPlanId && selectedPaymentMethod && mobile.length === 10) {
        btn.disabled = false;
        btn.classList.add('active');
        btn.innerHTML = 'Proceed to Pay &rarr; <div class="loader" id="loader"></div>';
      } else {
        btn.disabled = true;
        btn.classList.remove('active');
        btn.innerHTML = 'Select Plan &amp; Method &rarr; <div class="loader" id="loader"></div>';
      }
    }

    function buyPlan() {
      if (!selectedPlanId || !selectedPaymentMethod) return;

      const mobileInput = document.getElementById('mobile').value;
      const fullMobile = '0' + mobileInput; // Convert +63 9xx -> 09xx for backend consistency with standard PH format

      // UI State
      const btn = document.getElementById('btn-proceed');
      const loader = document.getElementById('loader');
      const errorMsg = document.getElementById('error-msg');

      btn.disabled = true;
      loader.style.display = 'inline-block';
      errorMsg.style.display = 'none';

      // Call Backend
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .createPayMongoCheckout(selectedPlanId, fullMobile, selectedPaymentMethod);
    }

    function onSuccess(url) {
      if (url) {
        window.location.href = url;
      } else {
        onFailure(new Error("No URL returned"));
      }
    }

    function onFailure(err) {
      const btn = document.getElementById('btn-proceed');
      const loader = document.getElementById('loader');
      const errorMsg = document.getElementById('error-msg');

      btn.disabled = false;
      loader.style.display = 'none';
      errorMsg.style.display = 'block';
      errorMsg.innerText = "Error: " + err.message;
    }
  </script>

</body>
</html>
