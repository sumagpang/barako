<section v-if="currentPage === 'announcements'" class="space-y-6">
  <div class="flex justify-between items-center">
    <h3 class="text-lg font-semibold">Manage Announcements</h3>
    <button @click="promptAddAnnouncement" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition">
      + New Announcement
    </button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-50 border-b border-slate-200">
        <tr>
          <th class="p-4 font-semibold text-slate-600">Title</th>
          <th class="p-4 font-semibold text-slate-600">Message</th>
          <th class="p-4 font-semibold text-slate-600">Status</th>
          <th class="p-4 font-semibold text-slate-600 text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="ann in dashboardData.announcements" :key="ann.id" class="border-b border-slate-100 hover:bg-slate-50 transition">
          <td class="p-4 font-medium">{{ ann.title }}</td>
          <td class="p-4 text-slate-500 max-w-xs truncate">{{ ann.message }}</td>
          <td class="p-4">
            <span :class="['px-2 py-1 rounded-full text-xs font-medium', ann.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600']">
              {{ ann.status }}
            </span>
          </td>
          <td class="p-4 text-right">
            <button @click="deleteAnnouncement(ann)" class="text-red-600 hover:text-red-800 text-sm font-medium">Delete</button>
          </td>
        </tr>
        <tr v-if="!dashboardData.announcements || dashboardData.announcements.length === 0">
          <td colspan="4" class="p-8 text-center text-slate-400">No announcements found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
