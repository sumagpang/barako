<script>
const { createApp, ref, onMounted } = Vue;

createApp({
  setup() {
    const currentPage = ref('dashboard');
    const loading = ref(true);
    const lastRefresh = ref(new Date().toLocaleTimeString());
    const dashboardData = ref({ sales: [], users: [], plans: [] });

    const refreshData = async () => {
      loading.value = true;
      try {
        const response = await callBackend('getDashboardData');
        dashboardData.value = response;
        lastRefresh.value = new Date().toLocaleTimeString();
      } catch (err) {
        console.error('Failed to fetch data:', err);
        alert('Error fetching data. Check console for details.');
      } finally {
        loading.value = false;
      }
    };

    const promptAddUser = () => {
      const username = prompt('Enter Mobile Number (Username):');
      if (!username) return;
      const passcode = prompt('Enter 6-digit Passcode:');
      if (!passcode) return;
      saveUser({ username, passcode, connectionStatus: 'Offline', syncStatus: 'Ready' });
    };

    const promptAddPlan = () => {
      const name = prompt('Plan Name:');
      if (!name) return;
      const price = prompt('Price (PHP):');
      if (!price) return;
      const durationHours = prompt('Duration (Hours):');
      if (!durationHours) return;
      savePlan({ id: 'p' + Date.now(), name, price: Number(price), durationHours: Number(durationHours), status: 'Active' });
    };

    const promptAddAnnouncement = () => {
      const title = prompt('Title:');
      if (!title) return;
      const message = prompt('Message:');
      if (!message) return;
      saveAnnouncement({ id: 'a' + Date.now(), title, message, status: 'Active' });
    };

    const saveUser = async (user) => {
      loading.value = true;
      try {
        await callBackend('saveUser', [user]);
        await refreshData();
      } finally {
        loading.value = false;
      }
    };

    const saveAnnouncement = async (ann) => {
      loading.value = true;
      try {
        await callBackend('saveAnnouncement', [ann]);
        await refreshData();
      } finally {
        loading.value = false;
      }
    };

    const deleteAnnouncement = async (ann) => {
      if (!confirm('Are you sure you want to delete this announcement?')) return;
      loading.value = true;
      try {
        await callBackend('deleteAnnouncement', [ann]);
        await refreshData();
      } finally {
        loading.value = false;
      }
    };

    const updateKeys = async () => {
      const paymongo = prompt('New Paymongo Secret Key (leave blank to keep current):');
      const semaphore = prompt('New Semaphore API Key (leave blank to keep current):');
      const token = prompt('New Mikrotik Token (leave blank to keep current):');
      if (!paymongo && !semaphore && !token) return;

      loading.value = true;
      try {
        await callBackend('updateKeys', [{ paymongo, semaphore, token }]);
        alert('Keys updated successfully!');
      } finally {
        loading.value = false;
      }
    };

    const changePassword = async () => {
      const password = prompt('Enter new Admin Password:');
      if (!password) return;
      loading.value = true;
      try {
        await callBackend('changePassword', [{ password }]);
        alert('Password changed successfully! You will need to use the new password next time.');
      } finally {
        loading.value = false;
      }
    };

    const savePlan = async (plan) => {
      loading.value = true;
      try {
        await callBackend('savePlan', [plan]);
        await refreshData();
      } finally {
        loading.value = false;
      }
    };

    const logout = () => {
      if (confirm('Are you sure you want to logout?')) {
        window.top.location.href = window.location.href.split('?')[0];
      }
    };

    const callBackend = (method, args = []) => {
      return new Promise((resolve, reject) => {
        // In GAS web apps, we use google.script.run for RPC
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .handleRpcManual(method, args); // We'll need a wrapper in Code.js if not using google.script.run directly
        } else {
          // Mock for local testing
          console.log('Mock RPC:', method, args);
          setTimeout(() => resolve({ sales: [], users: [], plans: [] }), 500);
        }
      });
    };

    onMounted(refreshData);

    return {
      currentPage,
      loading,
      lastRefresh,
      dashboardData,
      refreshData,
      saveUser,
      savePlan,
      promptAddUser,
      promptAddPlan,
      promptAddAnnouncement,
      saveAnnouncement,
      deleteAnnouncement,
      updateKeys,
      changePassword,
      logout
    };
  }
}).mount('#app');

// Helper for Code.js to handle RPC when called via google.script.run
function handleRpcManual(method, args) {
  // This would be called on the server side
  // But here it's just a placeholder for the logic
}
</script>
