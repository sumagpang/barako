<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi sa Bukid Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    [v-cloak] { display: none; }
    .nav-item.active { background-color: #1e293b; border-left: 4px solid #3b82f6; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app" v-cloak class="min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar -->
    <div class="w-full md:w-64 bg-slate-900 text-white flex-shrink-0">
      <div class="p-6">
        <h1 class="text-xl font-bold tracking-tight text-emerald-400">WiFi sa Bukid</h1>
        <p class="text-xs text-slate-400">Management Dashboard</p>
      </div>

      <nav class="mt-4">
        <div @click="currentPage = 'dashboard'" :class="['p-4 flex items-center cursor-pointer hover:bg-slate-800 nav-item', currentPage === 'dashboard' ? 'active' : '']">
          <span class="mr-3">📊</span> Dashboard
        </div>
        <div @click="currentPage = 'users'" :class="['p-4 flex items-center cursor-pointer hover:bg-slate-800 nav-item', currentPage === 'users' ? 'active' : '']">
          <span class="mr-3">👥</span> Users
        </div>
        <div @click="currentPage = 'sales'" :class="['p-4 flex items-center cursor-pointer hover:bg-slate-800 nav-item', currentPage === 'sales' ? 'active' : '']">
          <span class="mr-3">💰</span> Sales & Reports
        </div>
        <div @click="currentPage = 'plans'" :class="['p-4 flex items-center cursor-pointer hover:bg-slate-800 nav-item', currentPage === 'plans' ? 'active' : '']">
          <span class="mr-3">📋</span> Plans
        </div>
        <div @click="currentPage = 'announcements'" :class="['p-4 flex items-center cursor-pointer hover:bg-slate-800 nav-item', currentPage === 'announcements' ? 'active' : '']">
          <span class="mr-3">📢</span> Announcements
        </div>
        <div @click="currentPage = 'settings'" :class="['p-4 flex items-center cursor-pointer hover:bg-slate-800 nav-item', currentPage === 'settings' ? 'active' : '']">
          <span class="mr-3">⚙️</span> Settings
        </div>
      </nav>
    </div>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
      <header class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-bold capitalize">{{ currentPage.replace('-', ' ') }}</h2>
        <div class="flex items-center space-x-4">
          <button @click="refreshData" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Refresh</button>
          <div class="text-sm text-slate-500">Last updated: {{ lastRefresh }}</div>
        </div>
      </header>

      <!-- Dynamic Content -->
      <div v-if="loading" class="flex justify-center items-center h-64">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>

      <div v-else>
        <?!= include('dashboard'); ?>
        <?!= include('users'); ?>
        <?!= include('sales'); ?>
        <?!= include('plans'); ?>
        <?!= include('announcements'); ?>
        <?!= include('settings'); ?>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <?!= include('app-js'); ?>
</body>
</html>
