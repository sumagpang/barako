<section v-if="currentPage === 'plans'">
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-6 border-b border-slate-200 flex justify-between items-center">
      <h3 class="font-bold">Service Plans</h3>
      <button @click="promptAddPlan" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">Create New Plan</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-slate-50 text-xs uppercase text-slate-500 font-bold">
          <tr>
            <th class="px-6 py-4">ID</th>
            <th class="px-6 py-4">Name</th>
            <th class="px-6 py-4">Price</th>
            <th class="px-6 py-4">Duration (Hours)</th>
            <th class="px-6 py-4">Speed Limit</th>
            <th class="px-6 py-4">Status</th>
            <th class="px-6 py-4">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr v-for="plan in dashboardData.plans" :key="plan.id">
            <td class="px-6 py-4 text-sm font-mono">{{ plan.id }}</td>
            <td class="px-6 py-4 text-sm font-medium">{{ plan.name }}</td>
            <td class="px-6 py-4 text-sm font-bold">₱{{ plan.price }}</td>
            <td class="px-6 py-4 text-sm">{{ plan.durationHours }}h</td>
            <td class="px-6 py-4 text-sm font-mono text-blue-600">{{ plan.speedLimit || 'Unlimited' }}</td>
            <td class="px-6 py-4 text-sm">
              <span :class="['px-2 py-1 rounded-full text-xs font-medium', plan.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700']">
                {{ plan.status }}
              </span>
            </td>
            <td class="px-6 py-4 text-sm whitespace-nowrap">
              <button @click="promptEditPlan(plan)" class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
              <button @click="togglePlanStatus(plan)" :class="plan.status === 'Active' ? 'text-red-400 hover:text-red-600' : 'text-green-400 hover:text-green-600'" class="mr-3">
                {{ plan.status === 'Active' ? 'Disable' : 'Enable' }}
              </button>
              <button @click="deletePlan(plan)" class="text-red-600 hover:text-red-800">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
