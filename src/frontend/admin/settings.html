<section v-if="currentPage === 'settings'">
  <div class="max-w-4xl space-y-8">
    <!-- General Settings -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <h3 class="font-bold mb-4">API Configuration</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Paymongo Secret Key</label>
          <input type="password" value="********" class="w-full px-4 py-2 border rounded-lg text-sm bg-slate-50" readonly>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Semaphore API Key</label>
          <input type="password" value="********" class="w-full px-4 py-2 border rounded-lg text-sm bg-slate-50" readonly>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mikrotik Sync Token</label>
          <input type="password" value="********" class="w-full px-4 py-2 border rounded-lg text-sm bg-slate-50" readonly>
        </div>
      </div>
      <div class="mt-6">
        <button @click="updateKeys" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">Update Keys</button>
      </div>
    </div>

    <!-- Admin Password -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <h3 class="font-bold mb-4">Security</h3>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Change Admin Password</label>
        <div class="flex space-x-2">
          <button @click="changePassword" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm hover:bg-slate-900">Change Password</button>
        </div>
      </div>
    </div>

    <!-- Webhook Setup -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <h3 class="font-bold mb-4">Paymongo Webhook</h3>
      <p class="text-sm text-slate-500 mb-4">Ensure your webhook is correctly configured in Paymongo to receive payment notifications.</p>
      <button class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium hover:bg-slate-50 transition">Register Webhook Automatically</button>
    </div>
  </div>
</section>
