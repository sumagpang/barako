<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | ARASU</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden border border-gray-100 text-center">
        <div class="p-12">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gray-100 rounded-full mb-8">
                <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </div>
            <h1 class="text-3xl font-black text-gray-800 tracking-tight">Session Ended</h1>
            <p class="text-gray-400 font-medium mt-4 leading-relaxed">You have been successfully disconnected from ARASU WiFi. See you again soon!</p>

            <div class="mt-12 space-y-4">
                <a href="$(link-login)" class="block w-full bg-emerald-600 text-white font-black py-5 rounded-[2rem] shadow-lg hover:bg-emerald-700 transition-all">
                    LOGIN AGAIN
                </a>
                <p class="text-[10px] font-black text-gray-300 uppercase tracking-widest pt-4">ARASU WiFi sa Bukid</p>
            </div>
        </div>
    </div>
</body>
</html>
