<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Status | ARASU</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-gradient-to-b from-emerald-800 to-emerald-600 p-12 text-center text-white">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white bg-opacity-20 rounded-full mb-6 animate-pulse">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h1 class="text-3xl font-black tracking-tight">Connected</h1>
            <p class="text-emerald-100 text-sm font-bold uppercase tracking-widest mt-2">Active Session</p>
        </div>

        <div class="p-10 space-y-8">
            <div class="grid grid-cols-2 gap-6">
                <div class="bg-gray-50 p-6 rounded-3xl text-center">
                    <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Time Left</div>
                    <div class="text-xl font-black text-gray-800">$(remain-time)</div>
                </div>
                <div class="bg-gray-50 p-6 rounded-3xl text-center">
                    <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Data Used</div>
                    <div class="text-xl font-black text-gray-800">$(bytes-out-nice)</div>
                </div>
            </div>

            <div class="bg-emerald-50 p-6 rounded-3xl border border-emerald-100 flex items-center justify-between">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center text-white mr-4 shadow-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <div>
                        <div class="text-[10px] font-black text-emerald-600 uppercase tracking-widest">Subscriber</div>
                        <div class="font-black text-gray-800">$(username)</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] font-black text-emerald-600 uppercase tracking-widest">IP Address</div>
                    <div class="text-xs font-bold text-gray-500">$(ip)</div>
                </div>
            </div>

            <div class="space-y-4 pt-4">
                <a href="$(link-logout)" class="block w-full bg-gray-100 text-gray-600 text-center font-black py-5 rounded-[2rem] hover:bg-red-50 hover:text-red-500 transition-all">
                    DISCONNECT SESSION
                </a>
                <p class="text-center text-gray-300 text-[10px] font-bold uppercase tracking-widest">ARASU WiFi sa Bukid</p>
            </div>
        </div>
    </div>
</body>
</html>
