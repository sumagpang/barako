<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi sa Bukid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); min-height: 100vh; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl text-white">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-emerald-400">WiFi sa Bukid</h1>
      <p class="text-emerald-200/60 mt-1">Malakas na koneksyon sa bukid</p>
    </div>

    <form id="loginForm" action="$(link-login-only)" method="post" class="space-y-4">
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Mobile Number (Username)</label>
        <input type="text" name="username" placeholder="09xxxxxxxxx" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">6-Digit Passcode</label>
        <input type="password" name="password" placeholder="******" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">Connect to Internet</button>
      <div class="text-center py-2">
        <p class="text-slate-400 text-sm">Walang account?</p>
        <div class="grid grid-cols-2 gap-3 mt-2">
          <button type="button" onclick="openPlans()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">WiFi Plan</button>
          <button type="button" onclick="openTopUp()" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">Top Up</button>
        </div>
      </div>
      <div class="text-center text-sm text-slate-400">$(if error)<span class="text-red-400">$(error)</span>$(endif)</div>
    </form>
    <div class="mt-6 text-center">
      <p class="text-[10px] text-emerald-900 uppercase tracking-widest">WiFi sa Bukid Project</p>
      <a href="#" onclick="openAdmin()" class="text-[10px] text-emerald-800 hover:text-emerald-700 mt-2 inline-block">Admin Login</a>
    </div>
  </div>

  <!-- Plans Modal -->
  <div id="plansModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl text-white">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-emerald-400">Choose Plan</h2>
        <button onclick="closeModal('plansModal')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div id="planList" class="grid grid-cols-1 gap-3 max-h-[60vh] overflow-y-auto pr-2">
        <div class="animate-pulse bg-slate-800 h-20 rounded-xl"></div>
      </div>
      <button onclick="closeModal('plansModal')" class="mt-6 w-full text-slate-400 text-sm py-2 hover:text-white transition">Cancel</button>
    </div>
  </div>

  <!-- Top Up Modal -->
  <div id="topupModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-4">
        <h2 class="text-xl font-bold text-white">Wallet Top Up</h2>
        <p class="text-orange-400 font-medium">Add ₱100 to your account</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Enter Mobile Number</label>
          <input type="text" id="topupMobile" placeholder="09xxxxxxxxx" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>
        <button id="topupBtn" onclick="processTopUp()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">Proceed to Payment (₱100)</button>
        <button onclick="closeModal('topupModal')" class="w-full text-slate-400 text-sm py-2 hover:text-white transition">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Purchase Modal -->
  <div id="purchaseModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-4">
        <h2 class="text-xl font-bold text-white">Purchase Plan</h2>
        <p id="selectedPlanDisplay" class="text-emerald-400 font-medium"></p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Enter Number</label>
          <input type="text" id="buyerMobile" oninput="checkBalance()" placeholder="09xxxxxxxxx" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>
        <div id="balanceInfo" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
          <span class="text-slate-400 text-sm">Wallet Balance:</span>
          <span id="userBalance" class="text-lg font-bold text-emerald-400">₱0.00</span>
        </div>
        <div id="actionButtons" class="space-y-3">
          <!-- Dynamically filled -->
          <button id="mainBtn" onclick="processAction()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">Buy Plan</button>
        </div>
        <button onclick="closeModal('purchaseModal')" class="w-full text-slate-400 text-sm py-2 hover:text-white transition">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let API_URL = 'YOUR_FULL_WEB_APP_URL';
    let selectedPlan = null;
    let currentBalance = 0;
    let balanceDebounce = null;

    function openAdmin() {
      if (API_URL.indexOf('script.google.com') === -1) return alert('SETUP REQUIRED');
      const pw = prompt('Admin Password:');
      if (pw) window.location.href = `${API_URL}?page=admin&pw=${pw}`;
    }

    function openPlans() {
      document.getElementById('plansModal').classList.remove('hidden');
      fetchPlans();
    }

    function openTopUp() {
      document.getElementById('topupModal').classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    async function fetchPlans() {
      if (API_URL.indexOf('script.google.com') === -1) return;
      try {
        const res = await fetch(`${API_URL}?action=getPlans`);
        const plans = await res.json();
        const container = document.getElementById('planList');
        container.innerHTML = plans.map(plan => `
          <div onclick='selectPlan(${JSON.stringify(plan)})' class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 hover:border-emerald-500 cursor-pointer transition flex justify-between items-center">
            <div>
              <div class="text-emerald-400 font-bold">${plan.name}</div>
              <div class="text-xs text-slate-500">${plan.durationHours} Hours</div>
            </div>
            <div class="text-xl font-black text-white">₱${plan.price}</div>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }

    function selectPlan(plan) {
      selectedPlan = plan;
      document.getElementById('selectedPlanDisplay').innerText = `${plan.name} - ₱${plan.price}`;
      closeModal('plansModal');
      document.getElementById('purchaseModal').classList.remove('hidden');
      updateUI();
      checkBalance();
    }

    async function checkBalance() {
      const mobile = document.getElementById('buyerMobile').value;
      if (mobile.length < 11) {
        document.getElementById('balanceInfo').classList.add('hidden');
        updateUI();
        return;
      }
      clearTimeout(balanceDebounce);
      balanceDebounce = setTimeout(async () => {
        try {
          const res = await fetch(`${API_URL}?action=getUserInfo&mobileNumber=${mobile}`);
          const data = await res.json();
          currentBalance = data.balance || 0;
          document.getElementById('userBalance').innerText = `₱${currentBalance.toFixed(2)}`;
          document.getElementById('balanceInfo').classList.remove('hidden');
          updateUI();
        } catch(e) {}
      }, 500);
    }

    function updateUI() {
      const btn = document.getElementById('mainBtn');
      if (!selectedPlan) return;

      if (selectedPlan.price >= 100) {
        btn.innerText = 'Pay with GCash/Maya';
        btn.className = 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition';
      } else {
        if (currentBalance >= selectedPlan.price) {
          btn.innerText = 'Buy with Balance';
          btn.className = 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition';
        } else {
          btn.innerText = 'Top Up Wallet (₱100)';
          btn.className = 'w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl transition';
        }
      }
    }

    async function processTopUp() {
      const mobile = document.getElementById('topupMobile').value;
      if (!mobile || mobile.length < 11) return alert('Enter valid mobile number');

      const btn = document.getElementById('topupBtn');
      btn.disabled = true;
      btn.innerText = 'Processing...';

      try {
        const res = await fetch(`${API_URL}?action=topUp&mobileNumber=${mobile}`);
        const result = await res.json();
        if (result.success && result.checkoutUrl) {
          window.location.href = result.checkoutUrl;
        } else {
          alert(result.error || 'Failed to initialize top up.');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Proceed to Payment (₱100)';
      }
    }

    async function processAction() {
      const mobile = document.getElementById('buyerMobile').value;
      if (!mobile) return alert('Enter mobile number');

      const btn = document.getElementById('mainBtn');
      btn.disabled = true;
      const originalText = btn.innerText;
      btn.innerText = 'Processing...';

      try {
        let action = (selectedPlan.price >= 100) ? 'buyPlan' :
                     (currentBalance >= selectedPlan.price) ? 'buyPlan' : 'topUp';

        const res = await fetch(`${API_URL}?action=${action}&planId=${selectedPlan.id}&mobileNumber=${mobile}`);
        const result = await res.json();

        if (result.success) {
          if (result.checkoutUrl) {
            window.location.href = result.checkoutUrl;
          } else if (result.passcode) {
            alert(`Success! Your passcode is: ${result.passcode}. You are now being connected.`);
            window.location.href = `http://hotspot.bukid.net/login?action=from_payment&user=${result.username}&pass=${result.passcode}`;
          }
        } else {
          alert(result.error || 'Failed to process.');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = originalText;
      }
    }

    window.onload = function() {
      fetchPlans();
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'from_payment') {
        document.getElementsByName('username')[0].value = urlParams.get('user');
        document.getElementsByName('password')[0].value = urlParams.get('pass');
        document.getElementById('loginForm').submit();
      }
    };
  </script>
</body>
</html>
