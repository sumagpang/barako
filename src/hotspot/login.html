<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi sa Bukid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); min-height: 100vh; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl text-white">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-emerald-400">WiFi sa Bukid</h1>
      <p class="text-emerald-200/60 mt-1">Malakas na koneksyon sa bukid</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" action="$(link-login-only)" method="post" class="space-y-4">
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />

      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Mobile Number (Username)</label>
        <input type="text" name="username" placeholder="09xxxxxxxxx" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">6-Digit Passcode</label>
        <input type="password" name="password" placeholder="******" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">
        Connect to Internet
      </button>

      <div class="text-center py-2">
        <p class="text-slate-400 text-sm">Walang account?</p>
        <button type="button" onclick="openPlans()" class="mt-2 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">
          WiFi Plan
        </button>
      </div>

      <div class="text-center text-sm text-slate-400">
        $(if error)<span class="text-red-400">$(error)</span>$(endif)
      </div>
    </form>

    <div class="mt-6 text-center">
      <p class="text-[10px] text-emerald-900 uppercase tracking-widest">WiFi sa Bukid Project</p>
      <a href="#" onclick="openAdmin()" class="text-[10px] text-emerald-800 hover:text-emerald-700 mt-2 inline-block">Admin Login</a>
    </div>
  </div>


  <!-- Plans Modal -->
  <div id="plansModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl text-white">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-emerald-400">Choose Plan</h2>
        <button onclick="closeModal('plansModal')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div id="planList" class="grid grid-cols-1 gap-3 max-h-[60vh] overflow-y-auto pr-2">
        <!-- Plans will be loaded here automatically -->
        <div class="animate-pulse bg-slate-800 h-20 rounded-xl"></div>
        <div class="animate-pulse bg-slate-800 h-20 rounded-xl"></div>
      </div>
      <button onclick="closeModal('plansModal')" class="mt-6 w-full text-slate-400 text-sm py-2 hover:text-white transition">Cancel</button>
    </div>
  </div>

  <!-- Purchase Modal -->
  <div id="purchaseModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-white">Mobile Number</h2>
        <p id="selectedPlanDisplay" class="text-blue-400 font-medium"></p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Enter Number</label>
          <input type="text" id="buyerMobile" placeholder="09xxxxxxxxx" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
          <p class="text-[10px] text-slate-500 mt-1">Saan ise-send ang passcode?</p>
        </div>

        <button id="payButton" onclick="processPayment()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">
          Pay with GCash/Maya
        </button>

        <button onclick="closeModal('purchaseModal')" class="w-full text-slate-400 text-sm py-2 hover:text-white transition">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let API_URL = 'YOUR_FULL_WEB_APP_URL';
    let selectedPlan = null;

    function openAdmin() {
      if (API_URL.indexOf('script.google.com') === -1) {
        alert('SETUP ERROR: Please configure your FULL Web App URL in login.html');
        return;
      }
      const pw = prompt('Enter Admin Password:');
      if (pw) {
        window.location.href = `${API_URL}?page=admin&pw=${pw}`;
      }
    }

    function openPlans() {
      document.getElementById('plansModal').classList.remove('hidden');
      fetchPlans();
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    async function fetchPlans(retryCount = 0) {
      if (API_URL.indexOf('script.google.com') === -1) return;

      try {
        const res = await fetch(`${API_URL}?action=getPlans`);
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Server error (${res.status}): ${text.substring(0, 100)}`);
        }

        const plans = await res.json();
        const container = document.getElementById('planList');

        if (plans && Array.isArray(plans)) {
          if (plans.length > 0) {
            container.innerHTML = plans.map(plan => `
              <div onclick='selectPlan(${JSON.stringify(plan)})' class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 hover:border-emerald-500 cursor-pointer transition flex justify-between items-center group">
                <div>
                  <div class="text-emerald-400 font-bold">${plan.name}</div>
                  <div class="text-xs text-emerald-500/50">${plan.durationHours} Hours • ${plan.speedLimit || 'Unlimited'}</div>
                </div>
                <div class="text-xl font-black text-white">₱${plan.price}</div>
              </div>
            `).join('');
          } else {
            container.innerHTML = '<div class="col-span-full text-center p-8 text-slate-500">No active plans found in database.</div>';
          }
        } else if (plans && plans.error) {
          throw new Error(`Backend Error: ${plans.error}`);
        } else {
          throw new Error('Invalid response format from server');
        }
      } catch (err) {
        console.error('Fetch plans failed', err);
        if (retryCount < 2) {
          console.log('Retrying fetchPlans...');
          setTimeout(() => fetchPlans(retryCount + 1), 3000);
        } else {
          document.getElementById('planList').innerHTML = `
            <div class="col-span-full text-center p-8">
              <p class="text-red-400 text-sm mb-2">Error: ${err.message}</p>
              <p class="text-slate-500 text-[10px] mb-4 break-all">URL: ${API_URL}</p>
              <button onclick="fetchPlans()" class="px-4 py-2 bg-emerald-600 rounded-lg text-xs font-bold hover:bg-emerald-500 transition">Try Again</button>
            </div>
          `;
        }
      }
    }

    function selectPlan(plan) {
      selectedPlan = plan;
      document.getElementById('selectedPlanDisplay').innerText = `${plan.name} - ₱${plan.price}`;
      closeModal('plansModal');
      document.getElementById('purchaseModal').classList.remove('hidden');
    }

    async function processPayment() {
      const mobile = document.getElementById('buyerMobile').value;
      if (!mobile) return alert('Please enter mobile number');

      const btn = document.getElementById('payButton');
      btn.disabled = true;
      btn.innerText = 'Redirecting...';

      try {
        // We use GET for buyPlan to avoid CORS issues with POST in Google Apps Script
        const res = await fetch(`${API_URL}?action=buyPlan&planId=${selectedPlan.id}&mobileNumber=${mobile}`);
        const result = await res.json();

        if (result.success && result.checkoutUrl) {
          // Store for auto-sync logic
          localStorage.setItem('pendingRef', result.referenceId);
          window.location.href = result.checkoutUrl;
        } else {
          throw new Error(result.error || 'Failed to generate payment link.');
        }
      } catch (err) {
        alert('Payment Error: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Pay with GCash/Maya';
      }
    }

    // Initial load
    window.onload = function() {
      // 1. Fetch plans in background to make modal instant
      fetchPlans();

      // 2. Auto-login logic from payment redirect
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'from_payment') {
        const username = urlParams.get('user');
        const passcode = urlParams.get('pass');
        if (username && passcode) {
          document.getElementsByName('username')[0].value = username;
          document.getElementsByName('password')[0].value = passcode;
          document.getElementById('loginForm').submit();
        }
      }
    };
  </script>
</body>
</html>
