<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f0fdf4; /* green-50 */
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen text-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full">
      <div id="status-icon" class="mb-6 text-green-500 text-6xl animate-bounce">
        <i class="fas fa-search-dollar"></i>
      </div>

      <h2 id="status-title" class="text-2xl font-bold text-gray-800 mb-2">Verifying Transaction</h2>
      <p id="status-msg" class="text-gray-600 mb-8">Please wait while we confirm your payment with the gateway...</p>

      <div id="loader" class="w-12 h-12 border-4 border-green-200 border-t-green-600 rounded-full animate-spin mx-auto"></div>

      <div id="manual-actions" class="hidden mt-6 pt-6 border-t border-gray-100">
          <p class="text-xs text-gray-500 mb-2">Taking too long?</p>
          <a href="http://hotspot.mikrotik.com/login" class="text-green-600 font-bold hover:underline">Go to Login Page</a>
      </div>
    </div>

    <script>
      const MOBILE = "<?= mobile ?>";
      const PLAN_ID = "<?= planId ?>";
      let attempts = 0;
      const MAX_ATTEMPTS = 20; // 60 seconds (3s interval)

      function checkStatus() {
        attempts++;
        google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFail).rpc('checkUserStatus', { mobile: MOBILE });
      }

      function onSuccess(res) {
        if (res.status === 'success' && res.passcode) {
           // Payment Confirmed & User Created!
           document.getElementById('status-icon').innerHTML = '<i class="fas fa-check-circle"></i>';
           document.getElementById('status-title').textContent = "Payment Successful!";
           document.getElementById('status-msg').textContent = "Connecting you to the WiFi...";
           document.getElementById('loader').classList.add('hidden');

           // Redirect back to Mikrotik Hotspot with params for Auto-Login
           // The login.html on Router will detect `action=from_payment` and handle the rest.
           setTimeout(() => {
               window.location.href = "http://hotspot.mikrotik.com/login?action=from_payment&mobile=" + MOBILE + "&planId=" + PLAN_ID;
           }, 1500);

        } else {
           if (attempts < MAX_ATTEMPTS) {
               setTimeout(checkStatus, 3000);
           } else {
               showTimeout();
           }
        }
      }

      function onFail(e) {
         console.error(e);
         if (attempts < MAX_ATTEMPTS) setTimeout(checkStatus, 3000);
         else showTimeout();
      }

      function showTimeout() {
          document.getElementById('status-icon').innerHTML = '<i class="fas fa-exclamation-triangle text-orange-500"></i>';
          document.getElementById('status-title').textContent = "Verification Delayed";
          document.getElementById('status-msg').textContent = "We received your payment request but the confirmation is delayed. Please check your SMS for the passcode.";
          document.getElementById('loader').classList.add('hidden');
          document.getElementById('manual-actions').classList.remove('hidden');
      }

      // Start polling
      if(MOBILE) {
          checkStatus();
      } else {
          document.getElementById('status-msg').textContent = "Invalid Request Parameters.";
          document.getElementById('loader').classList.add('hidden');
      }
    </script>
  </body>
</html>
