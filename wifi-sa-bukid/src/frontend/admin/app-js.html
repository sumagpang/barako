<script>
  let SESSION_TOKEN = null;
  let chartInstance = null;

  function showSection(id) {
    if (!SESSION_TOKEN) {
      document.getElementById('login-modal').classList.remove('hidden');
      return;
    }

    document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');

    // Highlight sidebar item
    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
    const navItem = document.getElementById('nav-' + id);
    if(navItem) navItem.classList.add('active');

    if (id === 'dashboard') loadDashboard();
    if (id === 'users') loadUsers();
    if (id === 'plans') loadPlans();
    if (id === 'settings') loadSettings();
  }

  function attemptLogin() {
    const pass = document.getElementById('admin-password-input').value;
    google.script.run.withSuccessHandler(res => {
      if(res.status === 'success') {
        SESSION_TOKEN = res.token;
        document.getElementById('login-modal').classList.add('hidden');
        showSection('dashboard');
      } else {
        alert("Invalid Password");
      }
    }).withFailureHandler(handleError).rpc('adminLogin', { password: pass });
  }

  function loadDashboard() {
    const month = document.getElementById('filter-month').value;
    google.script.run.withSuccessHandler(renderDashboard).withFailureHandler(handleError).getDashboardData(month);
  }

  function renderDashboard(data) {
    document.getElementById('total-sales').textContent = "₱" + data.totalSales;
    document.getElementById('active-users-count').textContent = data.activeUsersCount;
    document.getElementById('total-traffic').textContent = data.traffic.download + " / " + data.traffic.upload;

    const topUsersList = document.getElementById('top-users-list');
    topUsersList.innerHTML = '';
    data.topUsers.forEach((user, index) => {
      const li = document.createElement('li');
      li.className = "flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors";

      const leftDiv = document.createElement('div');
      leftDiv.className = "flex items-center";
      const rank = document.createElement('span');
      rank.className = "font-bold text-green-600 mr-3 w-6 text-center";
      rank.textContent = "#" + (index + 1);
      const mobile = document.createElement('span');
      mobile.className = "text-gray-700 font-medium";
      mobile.textContent = user.mobile;

      leftDiv.appendChild(rank);
      leftDiv.appendChild(mobile);

      const rightDiv = document.createElement('div');
      rightDiv.className = "font-bold text-gray-800";
      rightDiv.textContent = "₱" + user.total;

      li.appendChild(leftDiv);
      li.appendChild(rightDiv);
      topUsersList.appendChild(li);
    });

    // Render Chart
    renderChart(data.planCounts);
  }

  function renderChart(planCounts) {
    const ctx = document.getElementById('planChart').getContext('2d');

    // Convert counts object to arrays
    const labels = Object.keys(planCounts);
    const data = Object.values(planCounts);

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: [
                    '#10B981', // Green
                    '#3B82F6', // Blue
                    '#F59E0B', // Yellow
                    '#8B5CF6', // Purple
                    '#EC4899'  // Pink
                ],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
  }

  function loadUsers() {
    google.script.run.withSuccessHandler(renderUsersTable).withFailureHandler(handleError).getDashboardData();
  }

  function renderUsersTable(data) {
    const tbody = document.getElementById('users-table-body');
    tbody.innerHTML = '';
    data.activeUsers.forEach(user => {
      const tr = document.createElement('tr');
      tr.className = "hover:bg-gray-50 transition-colors";

      const tdMobile = document.createElement('td');
      tdMobile.className = "px-6 py-4 border-b";
      tdMobile.textContent = user.mobile;
      tr.appendChild(tdMobile);

      const tdPlan = document.createElement('td');
      tdPlan.className = "px-6 py-4 border-b";
      tdPlan.textContent = user.planId;
      tr.appendChild(tdPlan);

      const tdStatus = document.createElement('td');
      tdStatus.className = "px-6 py-4 border-b";
      const spanStatus = document.createElement('span');
      spanStatus.className = "bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide";
      spanStatus.textContent = user.status;
      tdStatus.appendChild(spanStatus);
      tr.appendChild(tdStatus);

      const tdAction = document.createElement('td');
      tdAction.className = "px-6 py-4 border-b";
      const btn = document.createElement('button');
      btn.className = "text-red-500 hover:text-red-700 font-semibold text-sm transition-colors flex items-center";
      btn.innerHTML = '<i class="fas fa-power-off mr-1"></i> Disconnect';
      btn.onclick = function() { disconnectUser(user.mobile); };
      tdAction.appendChild(btn);
      tr.appendChild(tdAction);

      tbody.appendChild(tr);
    });
  }

  function disconnectUser(mobile) {
    if(confirm("Are you sure you want to disconnect " + mobile + "?")) {
      google.script.run.withSuccessHandler(() => {
        alert("User scheduled for disconnection.");
        loadUsers();
      }).withFailureHandler(handleError).kickUser(mobile);
    }
  }

  function loadPlans() {
    const container = document.getElementById('plans');
    container.innerHTML = `
      <h2 class="text-3xl font-bold text-white mb-6">Promo Plans</h2>
      <div class="glass-panel p-8 rounded-2xl shadow-lg">
        <h3 class="font-bold text-gray-800 text-lg mb-4">Add New Plan</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
            <input id="plan-id" placeholder="ID (e.g. PLAN1)" class="p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            <input id="plan-name" placeholder="Name (e.g. 1 Hour)" class="p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            <input id="plan-price" placeholder="Price (PHP)" type="number" class="p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            <input id="plan-dur" placeholder="Duration (Minutes)" type="number" class="p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            <input id="plan-speed" placeholder="Speed (e.g. 5M/5M)" class="p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
        </div>
        <button onclick="savePlan()" class="mt-4 bg-green-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-green-700 transition-colors w-full md:w-auto">
            <i class="fas fa-save mr-2"></i> Save Plan
        </button>
      </div>
    `;
  }

  function savePlan() {
    const plan = {
      id: document.getElementById('plan-id').value,
      name: document.getElementById('plan-name').value,
      price: document.getElementById('plan-price').value,
      durationMinutes: document.getElementById('plan-dur').value,
      speedLimit: document.getElementById('plan-speed').value
    };

    google.script.run.withSuccessHandler(() => {
      alert("Plan Saved!");
    }).withFailureHandler(handleError).rpc('savePlan', { token: SESSION_TOKEN, plan: plan });
  }

  // Announcement Logic
  document.addEventListener('click', function(e) {
    if(e.target.innerText === 'Post Announcement' && e.target.parentElement.id === 'announcements') {
      const textarea = e.target.previousElementSibling;
      const message = textarea.value;
      google.script.run.withSuccessHandler(() => {
        alert("Announcement Posted!");
        textarea.value = "";
      }).withFailureHandler(handleError).rpc('saveAnnouncement', { token: SESSION_TOKEN, message: message });
    }
  });

  // Settings Logic
  function loadSettings() {
    const container = document.getElementById('settings');
    container.innerHTML = `
       <h2 class="text-3xl font-bold text-white mb-6">Settings</h2>
       <div class="glass-panel p-8 rounded-2xl shadow-lg max-w-xl">
         <h3 class="font-bold text-gray-800 text-lg mb-4">Security</h3>
         <label class="block text-sm font-medium text-gray-700 mb-2">New Admin Password</label>
         <div class="flex">
            <input id="new-admin-pass" type="password" placeholder="Enter new password" class="flex-1 p-3 border rounded-l-lg focus:ring-2 focus:ring-green-500 outline-none">
            <button onclick="saveSettings()" class="bg-blue-600 text-white font-bold px-6 rounded-r-lg hover:bg-blue-700 transition-colors">Update</button>
         </div>
       </div>
    `;
  }

  function saveSettings() {
    const newPass = document.getElementById('new-admin-pass').value;
    if(!newPass) return;

    google.script.run.withSuccessHandler(() => {
      alert("Settings Updated");
    }).withFailureHandler(handleError).rpc('updateSettings', { token: SESSION_TOKEN, settings: { adminPassword: newPass } });
  }

  function handleError(e) {
    console.error(e);
    if (e.message.indexOf("script.googleusercontent.com") === -1) {
       alert("An error occurred: " + e.message);
    }
  }

  window.onload = function() {
    document.getElementById('login-modal').classList.remove('hidden');
  };
</script>
