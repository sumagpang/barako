<script>
  let SESSION_TOKEN = null;

  function showSection(id) {
    if (!SESSION_TOKEN) {
      document.getElementById('login-modal').classList.remove('hidden');
      return;
    }

    document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    if (id === 'dashboard') loadDashboard();
    if (id === 'users') loadUsers();
    if (id === 'plans') loadPlans();
    if (id === 'settings') loadSettings();
  }

  function attemptLogin() {
    const pass = document.getElementById('admin-password-input').value;
    // Use rpc instead of doPost
    google.script.run.withSuccessHandler(res => {
      if(res.status === 'success') {
        SESSION_TOKEN = res.token;
        document.getElementById('login-modal').classList.add('hidden');
        showSection('dashboard');
      } else {
        alert("Invalid Password");
      }
    }).rpc('adminLogin', { password: pass });
  }

  function loadDashboard() {
    const month = document.getElementById('filter-month').value;
    google.script.run.withSuccessHandler(renderDashboard).withFailureHandler(handleError).getDashboardData(month);
  }

  function renderDashboard(data) {
    document.getElementById('total-sales').textContent = "₱" + data.totalSales;
    document.getElementById('active-users-count').textContent = data.activeUsersCount;
    document.getElementById('total-traffic').textContent = data.traffic.download + " / " + data.traffic.upload;

    const topUsersList = document.getElementById('top-users-list');
    topUsersList.innerHTML = '';
    data.topUsers.forEach(user => {
      const li = document.createElement('li');
      li.className = "py-4 flex justify-between";

      // Safe rendering
      const mobileSpan = document.createElement('span');
      mobileSpan.textContent = user.mobile;

      const totalSpan = document.createElement('span');
      totalSpan.className = "font-bold";
      totalSpan.textContent = "₱" + user.total;

      li.appendChild(mobileSpan);
      li.appendChild(totalSpan);
      topUsersList.appendChild(li);
    });
  }

  function loadUsers() {
    google.script.run.withSuccessHandler(renderUsersTable).getDashboardData();
  }

  function renderUsersTable(data) {
    const tbody = document.getElementById('users-table-body');
    tbody.innerHTML = '';
    data.activeUsers.forEach(user => {
      const tr = document.createElement('tr');

      // Cell 1: Mobile
      const tdMobile = document.createElement('td');
      tdMobile.className = "px-5 py-5 border-b border-gray-200 bg-white text-sm";
      tdMobile.textContent = user.mobile;
      tr.appendChild(tdMobile);

      // Cell 2: Plan
      const tdPlan = document.createElement('td');
      tdPlan.className = "px-5 py-5 border-b border-gray-200 bg-white text-sm";
      tdPlan.textContent = user.planId;
      tr.appendChild(tdPlan);

      // Cell 3: Status
      const tdStatus = document.createElement('td');
      tdStatus.className = "px-5 py-5 border-b border-gray-200 bg-white text-sm";
      const spanStatus = document.createElement('span');
      spanStatus.className = "bg-green-200 text-green-900 rounded-full px-2 py-1";
      spanStatus.textContent = user.status;
      tdStatus.appendChild(spanStatus);
      tr.appendChild(tdStatus);

      // Cell 4: Action
      const tdAction = document.createElement('td');
      tdAction.className = "px-5 py-5 border-b border-gray-200 bg-white text-sm";
      const btn = document.createElement('button');
      btn.className = "text-red-600 hover:text-red-900";
      btn.textContent = "Disconnect";
      btn.onclick = function() { disconnectUser(user.mobile); };
      tdAction.appendChild(btn);
      tr.appendChild(tdAction);

      tbody.appendChild(tr);
    });
  }

  function disconnectUser(mobile) {
    if(confirm("Are you sure you want to disconnect " + mobile + "?")) {
      google.script.run.withSuccessHandler(() => {
        alert("User scheduled for disconnection.");
        loadUsers();
      }).kickUser(mobile);
    }
  }

  function loadPlans() {
    const container = document.getElementById('plans');
    container.innerHTML = `
      <h2 class="text-xl font-bold mb-4">Manage Plans</h2>
      <div class="bg-white p-4 rounded shadow mb-4">
        <h3 class="font-bold">Add/Update Plan</h3>
        <input id="plan-id" placeholder="ID (e.g. PLAN1)" class="border p-2 mr-2">
        <input id="plan-name" placeholder="Name" class="border p-2 mr-2">
        <input id="plan-price" placeholder="Price" type="number" class="border p-2 mr-2">
        <input id="plan-dur" placeholder="Minutes" type="number" class="border p-2 mr-2">
        <input id="plan-speed" placeholder="Speed (5M/5M)" class="border p-2 mr-2">
        <button onclick="savePlan()" class="bg-blue-500 text-white px-4 py-2 rounded">Save</button>
      </div>
    `;
  }

  function savePlan() {
    const plan = {
      id: document.getElementById('plan-id').value,
      name: document.getElementById('plan-name').value,
      price: document.getElementById('plan-price').value,
      durationMinutes: document.getElementById('plan-dur').value,
      speedLimit: document.getElementById('plan-speed').value
    };

    google.script.run.withSuccessHandler(() => {
      alert("Plan Saved!");
    }).rpc('savePlan', { token: SESSION_TOKEN, plan: plan });
  }

  // Announcement Logic
  document.addEventListener('click', function(e) {
    if(e.target.innerText === 'Post' && e.target.parentElement.id === 'announcements') {
      const textarea = e.target.previousElementSibling;
      const message = textarea.value;
      google.script.run.withSuccessHandler(() => {
        alert("Announcement Posted!");
        textarea.value = "";
      }).rpc('saveAnnouncement', { token: SESSION_TOKEN, message: message });
    }
  });

  // Settings Logic
  function loadSettings() {
    const container = document.getElementById('settings');
    container.innerHTML = `
       <h2 class="text-xl font-bold mb-4">Settings</h2>
       <div class="bg-white p-4 rounded shadow">
         <h3 class="font-bold mb-2">Change Admin Password</h3>
         <input id="new-admin-pass" type="password" placeholder="New Password" class="border p-2 mr-2">
         <button onclick="saveSettings()" class="bg-green-500 text-white px-4 py-2 rounded">Update</button>
       </div>
    `;
  }

  function saveSettings() {
    const newPass = document.getElementById('new-admin-pass').value;
    if(!newPass) return;

    google.script.run.withSuccessHandler(() => {
      alert("Settings Updated");
    }).rpc('updateSettings', { token: SESSION_TOKEN, settings: { adminPassword: newPass } });
  }

  function handleError(e) {
    console.error(e);
    alert("An error occurred: " + e.message);
  }

  window.onload = function() {
    // Show login modal initially
    document.getElementById('login-modal').classList.remove('hidden');
  };
</script>
