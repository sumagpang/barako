<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi sa Bukid - Logged Out</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden p-8 text-center relative">
        <div class="absolute top-0 left-0 w-full h-2 bg-gray-300"></div>

        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 text-gray-500 mb-6">
            <i class="fas fa-power-off text-3xl"></i>
        </div>

        <h2 class="text-2xl font-extrabold text-gray-800 mb-2">Disconnected</h2>
        <p class="text-gray-500 mb-8">Thank you for using WiFi sa Bukid.</p>

        <div class="bg-gray-50 rounded-xl p-4 mb-8 border border-gray-100">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-gray-400 uppercase font-bold">Session Time</span>
                <span class="text-gray-800 font-mono">$(uptime)</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-xs text-gray-400 uppercase font-bold">Data Used</span>
                <span class="text-gray-800 font-mono">$(bytes-out-nice)</span>
            </div>
        </div>

        <button onclick="window.location.href='$(link-login)'" class="w-full bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-gray-900 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
            Login Again
        </button>
    </div>

</body>
</html>
